name: Fuzz

on:
  schedule:
    - cron: "0 7 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - fuzz_model_parsing
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly

      - run: cargo install cargo-fuzz --version 0.13.1 --locked

      - name: Run fuzzer (${{ matrix.target }})
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=300
