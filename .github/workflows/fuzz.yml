name: Fuzz

on:
  schedule:
    - cron: "0 7 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - fuzz_agent_protocol
          - fuzz_validate_command
          - fuzz_model_parsing
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: nightly

      - run: cargo install cargo-fuzz --version 0.13.1 --locked

      - name: Run fuzzer (${{ matrix.target }})
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=300
