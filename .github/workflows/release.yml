name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions: {}

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false
    runs-on: ${{ matrix.os }}
    outputs:
      hash-x86_64-unknown-linux-gnu: ${{ steps.hash.outputs.hash-x86_64-unknown-linux-gnu }}
      hash-aarch64-unknown-linux-gnu: ${{ steps.hash.outputs.hash-aarch64-unknown-linux-gnu }}
      hash-x86_64-apple-darwin: ${{ steps.hash.outputs.hash-x86_64-apple-darwin }}
      hash-aarch64-apple-darwin: ${{ steps.hash.outputs.hash-aarch64-apple-darwin }}
      hash-x86_64-pc-windows-msvc: ${{ steps.hash.outputs.hash-x86_64-pc-windows-msvc }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build (cross)
        if: matrix.cross
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: cross build --release --locked --target "${BUILD_TARGET}"

      - name: Build (native)
        if: "!matrix.cross"
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "${BUILD_TARGET}"

      - name: Package (unix)
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          ARCHIVE_NAME="cloudapps-cli-${TARGET}"
          mkdir "${ARCHIVE_NAME}"
          cp "target/${TARGET}/release/cloudapps-cli" "${ARCHIVE_NAME}/"
          cp LICENSE README.md "${ARCHIVE_NAME}/"
          tar czf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"

      - name: Package (windows)
        if: runner.os == 'Windows'
        env:
          TARGET: ${{ matrix.target }}
        shell: pwsh
        run: |
          $archiveName = "cloudapps-cli-${env:TARGET}"
          New-Item -ItemType Directory -Path $archiveName
          Copy-Item "target\${env:TARGET}\release\cloudapps-cli.exe" $archiveName
          Copy-Item LICENSE, README.md $archiveName
          Compress-Archive -Path $archiveName -DestinationPath "${archiveName}.zip"

      - name: Generate subject hash for SLSA provenance
        id: hash
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            ARTIFACT="cloudapps-cli-${TARGET}.zip"
          else
            ARTIFACT="cloudapps-cli-${TARGET}.tar.gz"
          fi
          # macOS lacks sha256sum; fall back to shasum -a 256.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ARTIFACT}" > checksum.txt
          else
            shasum -a 256 "${ARTIFACT}" > checksum.txt
          fi
          # macOS base64 has no -w0; use tr to strip newlines.
          if base64 --help 2>&1 | grep -q -- '-w'; then
            ENCODED=$(base64 -w0 checksum.txt)
          else
            ENCODED=$(base64 -i checksum.txt | tr -d '\n')
          fi
          echo "hash-${TARGET}=${ENCODED}" >> "${GITHUB_OUTPUT}"

      - name: Upload artifact (unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloudapps-cli-${{ matrix.target }}
          path: cloudapps-cli-${{ matrix.target }}.tar.gz

      - name: Upload artifact (windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloudapps-cli-${{ matrix.target }}
          path: cloudapps-cli-${{ matrix.target }}.zip

  combine_hashes:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    env:
      HASHES: ${{ toJSON(needs.build.outputs) }}
    steps:
      - id: hashes
        run: |
          set -euo pipefail
          printf '%s' "$HASHES" | jq -r '.[] | @base64d' | sed '/^$/d' > hashes.txt
          echo "hashes=$(base64 -w0 hashes.txt)" >> "${GITHUB_OUTPUT}"

  # SLSA Level 3 provenance generation. The reusable workflow must be
  # referenced by tag (not commit SHA) so slsa-verifier can validate the
  # OIDC job_workflow_ref claim against the published tag.
  provenance:
    needs: [combine_hashes]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0  # zizmor: ignore[unpinned-uses]
    with:
      base64-subjects: ${{ needs.combine_hashes.outputs.hashes }}
      provenance-name: cloudapps-cli.intoto.jsonl
      upload-assets: true

  release:
    needs: [build, provenance]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Generate SBOM (CycloneDX JSON)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: artifacts/cloudapps-cli-sbom.cdx.json
          upload-release-assets: false
          upload-artifact: false

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec mv {} . \;
          sha256sum -- *.tar.gz *.zip cloudapps-cli-sbom.cdx.json > sha256sums.txt

      - name: Create Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          generate_release_notes: true
          files: |
            artifacts/cloudapps-cli-*.tar.gz
            artifacts/cloudapps-cli-*.zip
            artifacts/cloudapps-cli-sbom.cdx.json
            artifacts/sha256sums.txt
