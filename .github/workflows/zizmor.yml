name: zizmor

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      ZIZMOR_VERSION: 1.24.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Install zizmor
        run: cargo install zizmor --locked --version "${ZIZMOR_VERSION}"

      - name: Run zizmor (SARIF for code scanning)
        run: zizmor --format sarif --no-exit-codes .github/workflows > zizmor.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: zizmor.sarif
          category: zizmor

      - name: Fail on medium or higher severity findings
        run: |
          set -euo pipefail
          zizmor --format json --no-exit-codes .github/workflows > zizmor.json
          count=$(jq '[.[] | select(.determinations.severity == "Medium" or .determinations.severity == "High")] | length' zizmor.json)
          if [ "${count}" -gt 0 ]; then
            echo "::error::zizmor found ${count} finding(s) with medium or higher severity"
            zizmor --min-severity medium --no-exit-codes .github/workflows
            exit 1
          fi
          echo "No medium or higher severity findings."
