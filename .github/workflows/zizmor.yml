name: zizmor

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      ZIZMOR_VERSION: 1.24.1
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: stable

      - name: Install zizmor
        run: cargo install zizmor --locked --version "${ZIZMOR_VERSION}"

      - name: Run zizmor (SARIF for code scanning)
        run: zizmor --format sarif --no-exit-codes .github/workflows > zizmor.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: zizmor.sarif
          category: zizmor

      - name: Fail on medium or higher severity findings
        run: |
          set -euo pipefail
          zizmor --format json --no-exit-codes .github/workflows > zizmor.json
          count=$(jq '[.[] | select(.determinations.severity == "Medium" or .determinations.severity == "High")] | length' zizmor.json)
          if [ "${count}" -gt 0 ]; then
            echo "::error::zizmor found ${count} finding(s) with medium or higher severity"
            zizmor --min-severity medium --no-exit-codes .github/workflows
            exit 1
          fi
          echo "No medium or higher severity findings."
