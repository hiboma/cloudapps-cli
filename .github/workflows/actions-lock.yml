name: actions-lock

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      ACTIONS_LOCK_VERSION: 0.2.0
      ACTIONS_LOCK_SHA256: 79ec84c191667fd935a277e6fd3662cf5d3669cccc9e99998731d8f306f373b6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download actions-lock
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/actions-lock"
          binary="${RUNNER_TEMP}/actions-lock/gh-actions-lock"
          curl -fsSL --retry 3 -o "${binary}" \
            "https://github.com/github/gh-actions-lock/releases/download/v${ACTIONS_LOCK_VERSION}/linux-amd64"
          echo "${ACTIONS_LOCK_SHA256}  ${binary}" | sha256sum -c -
          chmod +x "${binary}"
          echo "${RUNNER_TEMP}/actions-lock" >> "${GITHUB_PATH}"

      - name: Verify workflow lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh-actions-lock --verify
