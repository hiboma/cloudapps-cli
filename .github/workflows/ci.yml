name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    # fmt and clippy only need to run once; the OS matrix exists because
    # target-conditional code (e.g. `#[cfg(unix)]` guards around the
    # environ scrub in src/config/mod.rs) was silently regressing on
    # Windows. The Windows matrix leg in particular catches the LNK2019
    # `unresolved external symbol environ` class of failure at PR time
    # rather than during the tag-triggered release workflow (see the
    # v0.9.0 / v0.9.1 release failures for the motivation).
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      # Lint checks only need to run on one OS.
      - if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check
      - if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --locked -- -D warnings
      # Release build must run on every OS the release workflow targets,
      # so compile- and link-level regressions are caught here.
      - run: cargo build --release --locked

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: stable
      - run: cargo install cargo-llvm-cov --locked
      - run: cargo llvm-cov --summary-only --locked
      - run: cargo test --locked

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  race-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: nightly
          components: rust-src
      - run: |
          RUSTFLAGS="-Z sanitizer=thread" \
          cargo +nightly test --lib --locked \
          -Z build-std \
          --target x86_64-unknown-linux-gnu
