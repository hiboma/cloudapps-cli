[package]
name = "cloudapps"
version = "0.2.0"
edition = "2024"
description = "CLI tool for Microsoft Defender for Cloud Apps REST API"
license = "MIT"
repository = "https://github.com/hiboma/cloudapps-cli"

[[bin]]
name = "cloudapps-cli"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
gag = "1"
libc = "0.2"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
subtle = "2"
serde_json = "1"
tabled = "0.17"
thiserror = "2"
tokio = { version = "1", features = ["full", "net", "io-util", "signal"] }
toml = "0.8"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
assert_cmd = "2"
mockito = "1"
predicates = "3"
tempfile = "3"
